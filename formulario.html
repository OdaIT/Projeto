<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sith recruitment form">
  <title>Formulário de Inscrição</title>
  <link rel="stylesheet" href="form.css">
</head>

<body>

  <form id="signupForm">
    <h2>Formulário de inscrição nos Sith</h2>

    <label for="firstName">Primeiro Nome</label>
    <input type="text" id="firstName" name="firstName" required>

    <label for="lastName">Último Nome</label>
    <input type="text" id="lastName" name="lastName" required>

    <label for="email">Endereço de Email</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Enviar</button>
    <p id="successMessage">Obrigado por te juntares aos Sith, assim que possível 'visitamos' o teu planeta.
    </p>
  </form>
  <div id="sithGif"></div>
<script>
  document.getElementById("signupForm").addEventListener("submit", function (event) {
    event.preventDefault();

    document.getElementById("successMessage").style.display = "block";
    setTimeout(() => {document.getElementById("sithGif").style.display = "block";},3000);

    this.reset();
    form.reset();
  });
</script>
</body>
</html>
